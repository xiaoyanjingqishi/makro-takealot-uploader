<!DOCTYPE html>
<html lang="zh-CN">
<head>
  {% include "components/head.html" %}
</head>
<body class="bg-slate-50 text-slate-800 antialiased h-screen overflow-hidden selection:bg-indigo-100 selection:text-indigo-900">
  <div id="app" v-cloak class="flex flex-col h-screen overflow-hidden bg-slate-50/70">
    
    <!-- ================= 全屏沉浸式登录门户 ================= -->
    {% include "components/login_modal.html" %}

    <!-- ================= 已登录工作区 ================= -->
    <template v-if="currentUser">
      <div class="flex flex-1 min-h-0 w-full overflow-hidden">

        <!-- 1. 左侧沉浸式侧边栏导航 -->
        {% include "components/sidebar.html" %}

        <!-- 2. 右侧主工作区 Wrapper -->
        <div class="flex-1 flex flex-col min-w-0 h-full overflow-hidden bg-slate-50">
          
          <!-- 顶部现代化轻量状态栏 -->
          {% include "components/header.html" %}

          <!-- 主界面区域 (填满视口垂直空间，由各业务 Tab 自行控制滚动) -->
          <main class="flex-1 min-h-0 w-full px-4 sm:px-6 pt-2 pb-2 flex flex-col overflow-hidden">
            <!-- 全局后台异步任务通知卡片 -->
            {% include "components/active_tasks_banner.html" %}

            <!-- 11 个业务 Tab 视图组件 -->
            {% include "views/tab_products.html" %}
            {% include "views/tab_inspector.html" %}
            {% include "views/tab_piggyback.html" %}
            {% include "views/tab_stores.html" %}
            {% include "views/tab_tasks.html" %}
            {% include "views/tab_settings.html" %}
            {% include "views/tab_store_products.html" %}
            {% include "views/tab_store_audits.html" %}
            {% include "views/tab_orders.html" %}
            {% include "views/tab_users.html" %}
            {% include "views/tab_management.html" %}
          </main>
        </div>
      </div>
    </template>

    <!-- ================= 全局业务弹窗集合 ================= -->
    {% include "components/modals.html" %}

    <!-- ================= Toast 浮动通知容器 ================= -->
    {% include "components/toasts.html" %}

  </div>

  <!-- ================= 模块化外部脚本引入 ================= -->
  {% include "components/scripts.html" %}
</body>
</html>
