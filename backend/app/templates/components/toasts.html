            class="px-5 py-2 text-xs font-semibold text-white bg-slate-900 hover:bg-slate-800 rounded-xl transition cursor-pointer shadow-xs active:scale-95"
          >
            知道了，继续加油
          </button>
        </div>
      </div>
    </div>

    <div class="fixed top-5 right-5 z-[10000] flex flex-col space-y-2 pointer-events-none max-w-sm">
      <div 
        v-for="t in toasts" 
        :key="t.id" 
        :class="{
          'bg-slate-900 text-white border-slate-800 shadow-slate-950/20': t.type === 'info',
          'bg-emerald-900 text-emerald-50 border-emerald-700/80 shadow-emerald-950/20': t.type === 'success',
          'bg-rose-900 text-rose-50 border-rose-700/80 shadow-rose-950/20': t.type === 'error',
          'bg-amber-900 text-amber-50 border-amber-700/80 shadow-amber-950/20': t.type === 'warning'
        }"
        class="px-3.5 py-2.5 rounded-xl border shadow-xl text-xs font-medium flex items-center space-x-2.5 pointer-events-auto transition-all duration-200 backdrop-blur-md animate-in slide-in-from-top-2"
      >
        <span class="text-sm shrink-0">
          <template v-if="t.type === 'success'">✓</template>
          <template v-else-if="t.type === 'error'">✕</template>
          <template v-else-if="t.type === 'warning'">⚠</template>
          <template v-else>ℹ</template>
        </span>
        <span class="tracking-tight leading-relaxed">{{ t.message }}</span>
      </div>
    </div>
