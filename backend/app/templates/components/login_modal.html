    <!-- ================= 全屏沉浸式登录门户 (未登录状态硬隔离，无法穿透进入系统) ================= -->
    <div v-if="!currentUser" class="fixed inset-0 z-[9999] flex items-center justify-center bg-gradient-to-br from-slate-900 via-slate-950 to-indigo-950 p-4">
      <div class="bg-white rounded-2xl max-w-md w-full shadow-2xl overflow-hidden border border-slate-200/90 p-8 ring-1 ring-black/5 animate-in zoom-in-95 duration-150">
        <div class="text-center mb-6">
          <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 text-white flex items-center justify-center font-black text-2xl mx-auto shadow-lg mb-3">
            M
          </div>
          <h2 class="text-xl font-bold text-slate-900 tracking-tight">Makro 智能搬品系统</h2>
          <p class="text-xs text-slate-500 mt-1">请输入账号与密码以登录系统并管理对应店铺</p>
        </div>

        <form @submit.prevent="doLogin" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">用户名</label>
            <input 
              type="text" 
              v-model="loginForm.username" 
              placeholder="例如: admin 或 员工账号" 
              class="w-full text-xs px-3.5 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none transition"
              required
              autofocus
            />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">登录密码</label>
            <input 
              type="password" 
              v-model="loginForm.password" 
              placeholder="请输入密码" 
              class="w-full text-xs px-3.5 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none transition"
              required
            />
          </div>

          <div v-if="loginForm.error" class="p-2.5 bg-rose-50 border border-rose-200 rounded-lg text-rose-700 text-xs flex items-center space-x-1.5">
            <span>⚠️</span>
            <span>{{ loginForm.error }}</span>
          </div>

          <button 
            type="submit" 
            :disabled="loginForm.loading"
            class="w-full py-2.5 bg-slate-900 hover:bg-slate-800 text-white rounded-xl font-bold text-xs shadow-md transition active:scale-95 cursor-pointer disabled:opacity-50"
          >
            {{ loginForm.loading ? '正在验证并登录...' : '立即登录' }}
          </button>
        </form>

        <div class="mt-6 pt-4 border-t border-slate-100 flex items-center justify-between text-[11px] text-slate-400">
          <span>初始超级管理员: <strong class="font-mono text-slate-700 font-bold">admin / admin123</strong></span>
        </div>
      </div>
    </div>
