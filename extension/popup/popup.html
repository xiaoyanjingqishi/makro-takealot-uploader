<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Makro 搬品助手</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="header">
      <div class="logo-area">
        <span class="logo-badge">M</span>
        <h3>Makro 搬品助手</h3>
      </div>
      <span id="backend-status" class="status-badge offline">检测中...</span>
    </header>

    <div class="body-content">
      <div class="card current-page-card">
        <div class="card-header">当前页面状态</div>
        <div id="page-info" class="page-info">正在识别页面...</div>
        <button id="action-btn" class="btn primary-btn" disabled>获取中...</button>
        <button id="auto-collector-btn" class="btn" style="display:none; margin-top: 8px; background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white; border: none; font-weight: 700; width: 100%;">
          📦 开启 Makro 自动筛选采集面板
        </button>
      </div>

      <div class="card stats-card">
        <div class="stat-item">
          <span class="stat-label">待上品商品</span>
          <span id="stat-count" class="stat-num">-</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">默认加价</span>
          <span id="stat-markup" class="stat-num">+35% +R20</span>
        </div>
      </div>

      <!-- 中台服务连接设置 -->
      <div class="card server-settings-card">
        <div class="card-header" style="display:flex;justify-content:space-between;align-items:center;">
          <span>中台服务连接配置</span>
          <span id="ping-indicator" style="font-size:10px;color:#64748b;">局域网/本机</span>
        </div>
        <div class="server-input-group">
          <input id="backend-url-input" type="text" class="server-input" placeholder="https://makro.superll.top" />
          <button id="save-backend-btn" class="save-btn" title="保存并测试连接">保存连接</button>
        </div>
        <div class="preset-group">
          <button type="button" id="preset-cloud" class="preset-pill" style="font-weight:700;color:#4338ca;background:#e0e7ff;">云端官方</button>
          <button type="button" id="preset-local" class="preset-pill">本机 :8001</button>
          <button type="button" id="preset-lan" class="preset-pill">局域网反代 (:80)</button>
          <button type="button" id="preset-lan-8001" class="preset-pill">局域网 :8001</button>
        </div>
        <div id="conn-feedback" class="conn-feedback"></div>
      </div>

      <!-- 采集员工身份绑定配置 (方案 A) -->
      <div class="card server-settings-card" style="margin-top: 10px;">
        <div class="card-header" style="display:flex;justify-content:space-between;align-items:center;">
          <span>👤 采集员工身份绑定</span>
          <span id="operator-indicator" style="font-size:10px;color:#10b981;">未选择</span>
        </div>
        <div class="server-input-group" style="margin-top: 6px;">
          <select id="operator-select" class="server-input" style="cursor: pointer; background: #fff;">
            <option value="">⏳ 正在获取员工列表...</option>
          </select>
        </div>
        <div id="operator-feedback" style="font-size: 11px; color: #64748b; margin-top: 4px;">
          采集的商品将自动归属到此员工名下
        </div>
      </div>

      <!-- 采集目标店铺绑定 -->
      <div class="card server-settings-card" style="margin-top: 10px;">
        <div class="card-header" style="display:flex;justify-content:space-between;align-items:center;">
          <span>🏪 采集目标店铺绑定</span>
          <span id="store-indicator" style="font-size:10px;color:#10b981;">默认主店</span>
        </div>
        <div class="server-input-group" style="margin-top: 6px;">
          <select id="store-select" class="server-input" style="cursor: pointer; background: #fff;">
            <option value="">⏳ 正在获取店铺列表...</option>
          </select>
        </div>
        <div id="store-feedback" style="font-size: 11px; color: #64748b; margin-top: 4px;">
          跟品采集将直接录入到所选目标店铺并排重
        </div>
      </div>

      <div class="actions-area">
        <a id="open-dashboard-btn" href="http://localhost:8001" target="_blank" class="btn outline-btn">
          🚀 打开搬品控制台
        </a>
      </div>
    </div>
    
    <footer class="footer">
      <span>Takealot &rarr; Makro 自动化</span>
      <span class="ver">v1.1.1</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
